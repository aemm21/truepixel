[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truepixel"
version = "3.0.0"
description = "Motor ligero y open-source de verificación de imágenes generadas por IA (espacial + Fourier)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "TruePixel contributors" }]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
truepixel-verify = "verify:main"
truepixel-train = "train:main"

[tool.setuptools]
py-modules = ["api", "checkpoint", "config", "dataset", "explain", "fourier", "model", "train", "verify"]
